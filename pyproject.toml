[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools==81" ]

[project]
name = "lead"
version = "1.4.0"
description = "LEAD: Minimizing Learner-Expert Asymmetry in End-to-End Driving"
readme = "README.md"
license-files = [ "LICENSE" ]
authors = [ { name = "Long Nguyen", email = "long@kesai.eu" } ]
requires-python = ">=3.10,<3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "basedpyright==1.39.9",
  "beartype==0.21",
  "carla==0.9.16",
  "dictor==0.1.12",
  "ephem==4.1.5",
  "filterpy==1.4.5",
  "flask==3.1.1",
  "imagecodecs==2025.3.30",
  "import-linter==2.3",
  "jaxtyping==0.3.2",
  "jupyter>=1.1.1",
  "lightning==2.6.1",
  "lmdb>=1.4,<2",
  "lxml==5.1",
  "matplotlib==3.10.3",
  "nbconvert==7.16.6",
  "nbformat==5.10.4",
  "nbstripout==0.8.2",
  "networkx==3.4.2",
  "numba==0.61.2",
  "numpy==1.26",
  "omegaconf==2.3",
  "open3d>=0.19",
  "opencv-python==4.11.0.86",
  "pandas-stubs==2.3.3.260113",
  "pexpect==4.9",
  "pillow==10.2",
  "pre-commit==4.2",
  "psutil==5.9.8",
  "py-trees==0.8.3",
  "py123d @ git+https://github.com/kesai-labs/py123d@dev_v0.7.0",
  "pydoclint==0.8.3",
  "pyqt5",
  "pytest==9.0.2",
  "pytest-cov==7",
  "pyturbojpeg==2.5",
  "requests==2.32.5",
  "ruff==0.14.10",
  "scipy==1.14.1",
  "setuptools==81",
  "shapely==2.0.4",
  "simple-watchdog-timer>=0.1.1",
  "six==1.16",
  "tabulate==0.9",
  "timm==1.0.25",
  "torch==2.8",
  "torchmetrics==1.9",
  "torchvision==0.23",
  "tqdm==4.66.1",
  "transforms3d==0.4.1",
  "wandb==0.26",
  "xmlschema==1.0.18",
]
urls.Homepage = "https://ln2697.github.io/lead"
urls.Repository = "https://github.com/kesai-labs/lead"
scripts.lead = "lead.__main__:main"

[tool.setuptools]
package-data.lead = [ "**/*" ]
packages.find.where = [ "src", "scripts" ]
packages.find.include = [ "lead*", "slurm*" ]
packages.find.exclude = [ "data*", "outputs*", "3rd_party*", "common*", "tests*" ]

[tool.uv]
# The cluster's driver caps at CUDA 12.x while the CI RTX 5090 needs sm_120
# kernels; cu128 covers both. torch 2.13 breaks torch.compile on our model
# (FakeTensor data-pointer access in the DDP graph compiler), so the pins stay
# on 2.8 until that is resolved.
sources.torch = [ { index = "pytorch-cu128" } ]
sources.torchvision = [ { index = "pytorch-cu128" } ]
index = [ { name = "pytorch-cu128", url = "https://download.pytorch.org/whl/cu128", explicit = true } ]

[tool.ruff]
line-length = 88
include = [ "scripts/**/*.py", "src/**/*.py", "tests/**/*.py" ]
exclude = [ "3rd_party" ]
fix = true
format.quote-style = "double"
lint.select = [
  "B",
  "E",
  "ERA001",
  "F",
  "FURB105",
  "I",
  "ISC003",
  "PIE808",
  "PLR0402",
  "RET504",
  "RET505",
  "T201",
  "UP",
]
lint.ignore = [ "E501", "E722", "F722" ]
lint.per-file-ignores."**/__init__.py" = [ "F401" ]
lint.per-file-ignores."*.ipynb" = [ "T201" ]
# CLI tools and notebooks report to stdout by design.
lint.per-file-ignores."scripts/**" = [ "T201" ]
lint.isort.known-first-party = [ "lead" ]

[tool.codespell]
ignore-words-list = "perturbate,unperturbated,statics,deques,ue,lightening"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
skip-checking-raises = true
allow-init-docstring = true
check-return-types = false
check-yield-types = false

[tool.pytest]
ini_options.markers = [
  "e2e: end-to-end tests over a collected dataset",
]

[tool.coverage]
run.branch = true
# Measure every module, not only the ones a test happens to import.
run.parallel = false
run.source = [ "lead" ]
report.exclude_also = [
  "@(abc\\.)?abstractmethod",
  "@(typing\\.)?overload",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
report.precision = 1
report.show_missing = true
report.skip_covered = false
html.directory = "outputs/coverage/html"
xml.output = "outputs/coverage/coverage.xml"

[tool.basedpyright]
include = [
  "src/lead",
  "scripts",
]
# expert/ drives CARLA through composed mixins pyright cannot see through.
exclude = [ "src/lead/expert" ]
typeCheckingMode = "standard"
pythonVersion = "3.10"
# Repeated in every executionEnvironment; they do not inherit it.
extraPaths = [ "src" ]
reportMissingTypeStubs = false
executionEnvironments = [
  # The CARLA leaderboard and scenario runner join sys.path only at runtime.
  { root = "src/lead/api/abstract_driving_agent.py", extraPaths = [ "src" ], reportMissingImports = "hint" },
  # Batch keys are config-gated: a decoder only reads keys its config flag guarantees.
  { root = "src/lead/policy", extraPaths = [ "src" ], reportTypedDictNotRequiredAccess = "none" },
  { root = "src/lead/common/image_decoders.py", extraPaths = [ "src" ], reportMissingImports = "hint" },
  { root = "src/lead/common", extraPaths = [ "src" ], reportMissingImports = "hint" },
  { root = "src", extraPaths = [ "src" ] },
]

[tool.importlinter]
root_package = "lead"
# Needed by the CARLA contract; external imports join the graph.
include_external_packages = true

[[tool.importlinter.contracts]]
# Lower layers never import higher ones; siblings on one line stay independent.
name = "layered architecture"
type = "layers"
layers = [
  "training | evaluation",
  "policy",
  "log_reader",
  "api",
  "cache",
  "common",
  "config",
]
containers = [ "lead" ]
ignore_imports = [
  # The driving-agent base composes the evaluation runtime; the only allowed edges.
  "lead.api.abstract_driving_agent -> lead.evaluation.inference.policy_runner",
  "lead.api.abstract_driving_agent -> lead.evaluation.recorder.infraction_recorder",
  "lead.api.abstract_driving_agent -> lead.evaluation.recorder.video_recorder",
  # The dataset contract composes the scene loader it draws samples from.
  "lead.api.abstract_dataset -> lead.log_reader.scene_loader",
  # The CARLA-to-123d converter writes the layout the log api names.
  "lead.common.carla_to_123d -> lead.api.py123d_log_api",
  "lead.config.** -> lead.common.**",
]

[[tool.importlinter.contracts]]
name = "training is policy-agnostic"
type = "forbidden"
source_modules = [ "lead.training" ]
forbidden_modules = [ "lead.policy", "lead.evaluation" ]

[[tool.importlinter.contracts]]
name = "the expert is isolated from the learning stack"
type = "forbidden"
source_modules = [ "lead.expert" ]
forbidden_modules = [ "lead.log_reader", "lead.cache", "lead.policy", "lead.training", "lead.evaluation" ]

[[tool.importlinter.contracts]]
name = "nothing imports the expert"
type = "forbidden"
source_modules = [
  "lead.api",
  "lead.config",
  "lead.common",
  "lead.log_reader",
  "lead.cache",
  "lead.policy",
  "lead.training",
  "lead.evaluation"
]
forbidden_modules = [ "lead.expert" ]

[[tool.importlinter.contracts]]
name = "the offline stack needs no CARLA"
type = "forbidden"
source_modules = [ "lead.log_reader", "lead.cache", "lead.config", "lead.policy", "lead.training" ]
forbidden_modules = [ "carla" ]
# Both are `if TYPE_CHECKING` imports, invisible at runtime; do not "fix" them.
ignore_imports = [
  "lead.common.geometry -> carla",
  "lead.common.planning.route_planner -> carla",
]

[[tool.importlinter.contracts]]
name = "the log layout stands alone"
type = "forbidden"
source_modules = [ "lead.api.py123d_log_api", "lead.api.driving_meta" ]
forbidden_modules = [
  "lead.cache",
  "lead.common",
  "lead.config",
  "lead.log_reader",
  "lead.expert",
  "lead.policy",
  "lead.training",
  "lead.evaluation",
]

[[tool.importlinter.contracts]]
name = "policies are independent of each other"
type = "independence"
modules = [ "lead.policy.transfuser", "lead.policy.ego_status" ]
