name: E2E

on:
  push:
    branches: [ main, pre-release ]
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use runner's micromamba and repo scripts
      # Reuses whatever conda-format env root already exists on this self-hosted runner
      # (same convention as the old $CONDA var, just renamed) so the persistent `lead` env
      # survives the switch with no reinstall. Installs the micromamba binary itself if
      # this runner doesn't already have it.
      run: |
        MAMBA_ROOT_PREFIX="${CONDA:-$HOME/micromamba}"
        echo "MAMBA_ROOT_PREFIX=$MAMBA_ROOT_PREFIX" >> "$GITHUB_ENV"
        if ! command -v micromamba >/dev/null; then
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$RUNNER_TEMP/micromamba.tar.bz2" https://micro.mamba.pm/api/micromamba/linux-64/latest
          tar -xjf "$RUNNER_TEMP/micromamba.tar.bz2" -C "$HOME/.local/bin" bin/micromamba --strip-components=1
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$GITHUB_WORKSPACE/scripts/cli" >> "$GITHUB_PATH"

    - name: Create lead environment (first run only)
      run: |
        [ -d "$MAMBA_ROOT_PREFIX/envs/lead" ] || micromamba create -y -n lead python=3.10

    - name: Install uv and system tools (first run only)
      run: |
        [ -x "$MAMBA_ROOT_PREFIX/envs/lead/bin/uv" ] || \
          micromamba install -y -n lead -c conda-forge uv ffmpeg parallel tree gcc zip unzip git-lfs uv rclone

    - name: Install project (torch, carla client, everything in uv.lock)
      # --reinstall-package forces setup.py to rerun even when uv's build cache
      # has an unchanged lead wheel, so create_dotenv() always bootstraps .env
      # (the checkout is fresh every run and .env is gitignored).
      run: micromamba run -n lead env UV_PROJECT_ENVIRONMENT=$MAMBA_ROOT_PREFIX/envs/lead uv sync --extra dev --reinstall-package lead

    - name: Configure .env
      # CARLA lives in $HOME, not the workspace: checkout's git clean would
      # delete an untracked in-repo install on every run (~20 GB re-download).
      run: |
        sed -i "s|^CARLA_ROOT=.*|CARLA_ROOT=${HOME}/CARLA/standard_0916|" .env

    - name: Install CARLA server (first run only)
      run: |
        [ -x "$HOME/CARLA/standard_0916/CarlaUE4.sh" ] || \
          bash scripts/common/setup_carla.sh "$HOME/CARLA/standard_0916"

    - name: Run data collection
      env:
        LEAD_RUNTIME_TYPE_CHECKING: "true"
      run: |
        case "$GITHUB_REF_NAME" in
          pre-release) bash .github/scripts/collect_data_pre_release.sh ;;
          *)           bash .github/scripts/collect_data_main.sh ;;
        esac

    - name: Run E2E tests
      # PY123D_DATA_ROOT lives in the generated .env, not the workflow env.
      run: |
        export LEAD_TEST_DATA_ROOT="$(grep '^PY123D_DATA_ROOT=' .env | cut -d= -f2-)"
        micromamba run -n lead python -m pytest tests/e2e_tests/ -v

    - name: Run notebooks
      run: micromamba run -n lead jupyter execute notebooks/*.ipynb

    - name: Stop CARLA server
      if: always()
      run: clean_carla || true
