name: CI

on:
  push:
    branches: [ main, "dev-v*" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure .env
      run: |
        cp .env.example .env
        sed -i "s|^CARLA_ROOT=.*|CARLA_ROOT=${GITHUB_WORKSPACE}/3rd_party/CARLA/standard_0916|" .env
        sed -i "s|^PY123D_DATA_ROOT=.*|PY123D_DATA_ROOT=${GITHUB_WORKSPACE}/data/expert_debug|" .env

    - name: Install micromamba
      # Creates & caches the `lead` env in one step (env contents keyed on this
      # workflow file, since that's what determines the tool list below).
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: lead
        create-args: python=3.10 -c conda-forge ffmpeg parallel tree gcc zip unzip git-lfs uv
        cache-environment: true
        cache-environment-key: environment-${{ runner.os }}-py3.10-${{ hashFiles('.github/workflows/ci.yml') }}

    - name: Install project
      # Always sync, even on a cache hit: the cached env's editable install of the
      # project goes stale whenever the package layout changes (deps stay cached, so
      # this is fast).
      run: micromamba run -n lead env UV_PROJECT_ENVIRONMENT=$MAMBA_ROOT_PREFIX/envs/lead uv sync --extra dev

    - name: Run unit tests
      # Enables the beartype+jaxtyping import hook for all of lead.*
      # (see src/lead/__init__.py).
      env:
        LEAD_RUNTIME_TYPE_CHECKING: "true"
      run: micromamba run -n lead pytest tests/unittests

    - name: Cache pre-commit environments
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      run: micromamba run -n lead pre-commit run --all-files
